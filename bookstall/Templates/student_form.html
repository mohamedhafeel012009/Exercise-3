<!DOCTYPE html>
<html>
<head>
    <title>Book Form</title>
</head>
<body>
    <h1>
        {% if student %}
            Update student
        {% else %}
            Add student
        {% endif %}
    </h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label>
        <input type="text" name="title"
               value="{{ student.title|default:'' }}" required>
        <br><br>

        <label>Author:</label>
        <input type="text" name="author"
               value="{{ student.author|default:'' }}" required>
        <br><br>

        <label>Price:</label>
        <input type="number" name="price"
               value="{{ student.price|default:'' }}" required>
        <br><br>

        <button type="submit">Save Book</button>
    </form>

    <br>
    <a href="{% url 'student_list' %}">Back to List</a>
</body>
</html>
