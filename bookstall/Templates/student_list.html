<!DOCTYPE html>
<html>
<head>
    <title>Book Management</title>
</head>
<body>
    <h1>Book Management System</h1> 
    <a href="{% url 'student_create' %}">
        Add Book
    </a>

    <hr>

    <table border="1" cellpadding="10">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.title }}</td>
            <td>{{ student.author }}</td>
            <td>{{ student.price }}</td>
            <td>
                <a href="{% url 'student_update' student.id %}">
                    Edit
                </a>

                <form method="POST"
                      action="{% url 'student_delete' student.id %}"
                      style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No book found</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
